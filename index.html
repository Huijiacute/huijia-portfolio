<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No-flash theme bootstrap. Runs synchronously before any paint so the
      correct .light / .dark class is on <html> before React mounts, matching
      the project's ThemeProvider (storageKey "theme", default "system").
      This prevents a flash of the wrong theme on first load / refresh.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (e) {
          /* localStorage/matchMedia unavailable — fall back to CSS defaults */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/jia_cute_cartoon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Mainframe hero fonts -->
    <link
      href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium"
      rel="stylesheet"
    />
    <link
      href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg"
      rel="stylesheet"
    />
    <title>Hui Jia — Design with Feeling</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Surface any uncaught error / unhandled rejection directly on the page
      // so a blank screen always shows the underlying cause.
      (function () {
        function show(msg) {
          var el = document.getElementById("__err");
          if (!el) {
            el = document.createElement("pre");
            el.id = "__err";
            el.style.cssText =
              "position:fixed;inset:0;z-index:99999;margin:0;padding:16px;background:#fff;color:#b00;font:13px/1.4 monospace;white-space:pre-wrap;overflow:auto";
            document.body.appendChild(el);
          }
          el.textContent += msg + "\n\n";
        }
        window.addEventListener("error", function (e) {
          show("ERROR: " + (e.message || e.error) + "\n" + (e.error && e.error.stack ? e.error.stack : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("UNHANDLED REJECTION: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
